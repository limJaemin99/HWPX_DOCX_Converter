name: 시험 문서 만들기 (LibreOffice DOCX)

# 손으로 한 번 돌림. 만든 DOCX를 새 브랜치에 커밋해 두면 PR로 develop에 올린다.
# CI는 저장소에 고정된 파일을 쓰고, 여기서 매번 다시 만들지 않는다.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 결과를 커밋할 새 브랜치 (이미 있으면 실패)
        required: true
        default: test/6-libreoffice-docx

permissions:
  contents: write

jobs:
  docgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: LibreOffice Writer 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer fonts-nanum
      - name: LibreOffice 버전
        id: lo
        run: echo "version=$(soffice --version | head -1)" >> "$GITHUB_OUTPUT"
      - name: .fodt → DOCX
        run: bash tools/docgen/make-docx.sh src/test/resources/docs/docx
      - name: 새 브랜치에 커밋·푸시
        env:
          BRANCH: ${{ inputs.branch }}
          LO_VERSION: ${{ steps.lo.outputs.version }}
        run: |
          git config user.name "limJaemin99"
          git config user.email "131847294+limJaemin99@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/test/resources/docs/docx
          git commit -m "test: LibreOffice로 만든 공개 시험 문서(DOCX) 추가" -m "만든 프로그램: $LO_VERSION"
          git push origin "$BRANCH"
          {
            echo "## $LO_VERSION"
            echo
            echo '```'
            ls -l src/test/resources/docs/docx
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
